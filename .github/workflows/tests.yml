name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # setup-uv used to create a `.venv` automatically; since uv 0.11.16 it no
      # longer does, so `uv pip install` (in shell/install.sh) has no
      # environment and aborts with "No virtual environment found". Create it
      # explicitly: the `.venv` that install.sh and `uv run` both target.
      - name: Create virtual environment
        run: uv venv
      - name: Display Python version
        run: uv run python -c "import sys; print(sys.version)"
      - name: Install graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
      - name: Install Synalinks
        run: ./shell/install.sh
      - name: Install dev/test dependencies
        run: uv pip install --group dev
      # The Linux sandbox backend pivots into a FUSE mount of the virtual
      # filesystem: install libfuse explicitly rather than rely on the image.
      - name: Install libfuse (Linux sandbox backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-3
      # GitHub's ubuntu-24.04 runners ship
      # kernel.apparmor_restrict_unprivileged_userns=1, which lets unshare()
      # create a user namespace but then neuters it so the /proc/self/setgroups
      # write EPERMs; sandbox confinement can't initialize. Flip it off so the
      # MirageSandbox confinement is genuinely exercised in CI.
      - name: Enable unprivileged user namespaces (sandbox confinement)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      # macOS confines in a libkrun microVM (the Linux backend inside a guest
      # kernel), with Seatbelt as the floor where no VM can run. Install
      # libkrun so the microVM is exercised wherever the runner allows it.
      # `brew trust` is only needed (and only exists) on recent Homebrew.
      - name: Install libkrun (macOS microVM backend)
        if: runner.os == 'macOS'
        run: |
          brew tap slp/krun
          brew trust --formula slp/krun/libkrun || true
          brew trust --formula slp/krun/libkrunfw || true
          brew install slp/krun/libkrun
      # Fail loudly if the sandbox would not use the strongest isolation the
      # runner supports, rather than letting the confine tests silently skip:
      # Linux must confine with namespaces; macOS with the microVM whenever the
      # runner exposes Hypervisor.framework (hosted runners are VMs and often
      # do not), and never with nothing. Building the helper and provisioning
      # the guest image here keeps a setup failure out of the test run.
      - name: Assert the strongest sandbox backend is available
        run: |
          uv run python - <<'EOF'
          import platform
          from synalinks.src.utils.confinement_utils import confinement_backend
          backend, why = confinement_backend()
          print("sandbox backend:", backend, why)
          if platform.system() == "Linux":
              raise SystemExit(0 if backend == "namespaces" else 1)
          from synalinks.src.utils.microvm_utils import hypervisor_supported, prepare_microvm
          if hypervisor_supported():
              if backend != "microvm":
                  raise SystemExit("hypervisor available but no microVM: " + why)
              print("microVM ready:", prepare_microvm())
          raise SystemExit(0 if backend in ("microvm", "seatbelt") else 1)
          EOF
      - name: Run the tests
        run: uv run pytest --cov-config=pyproject.toml
      - name: Generate coverage badge
        if: runner.os == 'Linux'
        run: uvx --from 'genbadge[coverage]' genbadge coverage -i coverage.xml
