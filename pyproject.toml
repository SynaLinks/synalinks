[project]
name = "synalinks"
description = "Graph-Based Programmable Neuro-Symbolic LM Framework"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Unix",
  "Operating System :: MacOS",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
]
dependencies = [
  "absl-py",
  "asyncio",
  "click",
  "datasets",
  "docstring-parser",
  "duckdb",
  "fastmcp>=4",
  "graphviz",
  "greenlet",
  "inquirer",
  "jinja2",
  "jsonschema",
  # <0.20: the 0.20 macOS ALGO extension (PageRank, community detection)
  # links libnetworkit/libarrow/libomp by rpaths to ladybug's build machine
  # and does not ship them, so `LOAD algo` fails on every Mac.
  "ladybug>=0.19.1,<0.20",
  # E2B's chart extraction for the sandbox's Result.chart (MIT).
  "e2b-charts>=1.0.0",
  "lancedb>=0.30.2",
  "litellm>=1.84.0",
  "markdown-it-py",
  "matplotlib",
  "mcp>=2",
  "httpx2",
  # >=3.16.1: 3.13.0 - 3.15.2 carry GHSA-h7x2-h6g9-p789 (AI Gateway SSRF).
  "mlflow>=3.16.1",
  "namex",
  "numpy",
  "dill",
  # The [fuse] extra brings mfusepy, which MirageSandbox's Linux confinement
  # needs to mount the virtual filesystem it pivots into. Missing libfuse is
  # detected by `_confinement_available` (synalinks/src/sandboxes/_confinement.py)
  # and fails closed under `require_confinement`.
  "mirage-ai[fuse]>=0.0.6",
  "optree",
  "orjson",
  "pillow",
  "pydantic",
  "pydotplus",
  "rich",
  "skills-ref>=0.1.1",
  # Decodes the audio files `read_audio` sends (WAV, FLAC, OGG, MP3); the
  # wheels bundle libsndfile.
  "soundfile>=0.12",
  "synaops>=0.2.1",
  "tenacity",
]

[project.urls]
Homepage = "https://github.com/SynaLinks/synalinks"
Issues = "https://github.com/SynaLinks/synalinks/issues"

[project.scripts]
synalinks = "synalinks.cli.main:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json"]
# Ship the project templates inside the wheel so `synalinks init` works
# offline. The patterns cover regular files and dotfiles (e.g. .gitignore,
# .python-version, .gitkeep) at every depth under cli/templates.
"synalinks.cli" = ["templates/**/*", "templates/**/.*"]
# The macOS microVM helper is compiled from source on the user's machine.
"synalinks.src.utils" = ["krun/*.c"]

[tool.setuptools.dynamic]
version = {attr = "synalinks.src.version.__version__"}

[tool.setuptools.packages.find]
include = ["synalinks", "synalinks.*"]

[tool.ruff]
line-length = 90
# Bundled project templates are scaffolding data, not linted source.
extend-exclude = ["synalinks/cli/templates"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle error
  "F",  # Pyflakes
  "I",  # isort
]
ignore = [
  "E722",  # do not use bare 'except'
  "E741",  # ambiguous variable name
  "E731",  # do not assign a `lambda` expression, use a `def`
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E501", "F401"]  # lines too long; imported but unused
"**/random.py" = ["F401"]  # imported but unused
"examples/*" = ["I", "E"]
"notebooks/*" = ["I", "E", "F"]
"guides/*" = ["I", "E", "F"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["synalinks"]

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::ImportWarning",
  "ignore::RuntimeWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::FutureWarning",
  "ignore::UserWarning",
]
addopts = "--cov-report xml --cov=synalinks -v"

# Do not run tests in the `build` folders or in the gitignored nested
# projects (`synalinks-research`, `synalinks-gym`, `synalinks-website`):
# they are not part of the released package.
norecursedirs = ["build", "synalinks-research", "synalinks-gym", "synalinks-website"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "@abstract",
  "raise NotImplementedError",
]
omit = [
  "*/__init__.py",
  "*/plot_*.py",
  "*/*_visualization.py",
  "*/async_utils.py",
]

[tool.coverage.run]
branch = true
omit = [
  "*/__init__.py",
  "*/async_utils.py",
  "*_test.py",
  "*/testing/*",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "keras-tuner>=1.4",
    "mkdocstrings[python]>=1.0.4",
    "zensical>=0.0.46",
    # Only to check the sandbox against E2B's own SDK (e2b_compatibility_test).
    "e2b-code-interpreter>=2.10.0",
]
